services:
  - type: web
    name: opening-act
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1/
      - key: LLM_MODEL
        value: Qwen/Qwen3-235B-A22B-Instruct-2507
      - key: LLM_API_KEY
        sync: false
      - key: RATE_LIMIT_PER_HOUR
        value: "30"
      - key: CACHE_PATH
        value: /tmp/opening_act_cache.sqlite
